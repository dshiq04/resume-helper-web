# 开发环境：本机 MySQL + 本机 Redis，前端由 Vite 开发服务器代理。
# 数据库账号密码请按需修改（或使用环境变量 DB_* 覆盖）。
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:18080}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:jobtrack}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
      connection-test-query: SELECT 1
  # 切换 PostgreSQL 时：替换上面的 datasource 为下面注释块，并改用 schema-postgresql.sql。
  # datasource:
  #   driver-class-name: org.postgresql.Driver
  #   url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:jobtrack}?sslmode=disable
  #   username: ${DB_USERNAME:postgres}
  #   password: ${DB_PASSWORD:}
  sql:
    init:
      schema-locations: classpath:schema-mysql.sql
      # schema-locations: classpath:schema-postgresql.sql
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2s
      connect-timeout: 2s

# 应用级 Redis 开关：在线状态与验证码都依赖它。
redis:
  enabled: true
  host: ${REDIS_HOST:127.0.0.1}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  database: ${REDIS_DATABASE:0}
  key-prefix: "jobtrack:"
  timeout: 2s

captcha:
  enabled: true
  type: char
  length: 4
  width: 130
  height: 44
  ttl-seconds: 180

app:
  name: 履途 ResumeTrail
  version: "1.2"
  data-dir: ./data
  log-dir: ./log
  seed-demo: false
  cors:
    allowed-origins:
      - http://127.0.0.1:5173
      - http://localhost:5173
  jwt:
    secret: ${JWT_SECRET:jobtrack-local-dev-secret-change-me-0123456789abcdef}
    ttl-hours: 72
  storage:
    secret: ${STORAGE_SECRET:jobtrack-file-encryption-secret-change-me-0123456789}
    max-file-size-mb: 50
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:123456}
    display-name: 管理员
    tenant-name: 默认工作区

logging:
  level:
    root: INFO
  file:
    name: ./log/jobtrack.log

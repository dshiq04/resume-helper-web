# 生产环境：默认 PostgreSQL，前端构建产物由 Nginx 等静态服务器托管。
# JWT_SECRET / STORAGE_SECRET 必须通过环境变量显式提供，缺失时启动失败。
server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:18080}

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:jobtrack}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 3000
      connection-test-query: SELECT 1
  # 使用 MySQL 时：替换上面的 datasource 为下面注释块，并改用 schema-mysql.sql。
  # datasource:
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  #   url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:jobtrack}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
  #   username: ${DB_USERNAME:root}
  #   password: ${DB_PASSWORD:}
  sql:
    init:
      schema-locations: classpath:schema-postgresql.sql
      # schema-locations: classpath:schema-mysql.sql
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2s
      connect-timeout: 2s

redis:
  enabled: true
  host: ${REDIS_HOST:127.0.0.1}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  database: ${REDIS_DATABASE:0}
  key-prefix: "jobtrack:"
  timeout: 2s

captcha:
  enabled: true
  type: char
  length: 4
  width: 130
  height: 44
  ttl-seconds: 180

app:
  name: 履途 ResumeTrail
  version: "1.2"
  data-dir: ./data
  log-dir: ./log
  seed-demo: false
  cors:
    # 前后端分离部署时填写前端站点地址，逗号分隔；* 表示不限制。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  jwt:
    secret: ${JWT_SECRET}
    ttl-hours: ${JWT_TTL_HOURS:72}
  storage:
    secret: ${STORAGE_SECRET}
    max-file-size-mb: ${MAX_FILE_SIZE_MB:50}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:123456}
    display-name: 管理员
    tenant-name: 默认工作区

logging:
  level:
    root: INFO
  file:
    name: ./log/jobtrack.log

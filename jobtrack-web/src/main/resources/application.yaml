# 说明：
# 服务端运行配置全部来自项目根目录的 config.json（由 JsonConfigEnvironmentPostProcessor 载入）。
# 本文件只保留框架级默认值，不在这里重复端口、数据库、日志等配置。
spring:
  application:
    name: jobtrack
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  sql:
    init:
      mode: always
      encoding: UTF-8
      # config.json 载入后会按数据库类型覆盖为 schema-mysql.sql。
      schema-locations: classpath:schema-sqlite.sql
  main:
    banner-mode: off

mybatis-plus:
  # 每个模块的 resources/mapper 下都有对应的 Mapper XML。
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  compression:
    enabled: true
  error:
    whitelabel:
      enabled: false

# 通用配置：所有环境共享。
# 环境相关配置（端口、数据库、Redis、验证码、JWT、存储等）放在
# application-dev.yml / application-test.yml / application-prod.yml。
# 默认激活 dev，可通过 SPRING_PROFILES_ACTIVE 或 --spring.profiles.active 覆盖。
spring:
  application:
    name: jobtrack
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  sql:
    init:
      # 建表脚本均为 CREATE TABLE IF NOT EXISTS，可重复执行。
      mode: always
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/resume-helper}
    connection-timeout: 2s
  main:
    banner-mode: console
  web:
    error:
      whitelabel:
        enabled: false

app:
  # 业务查询缓存统一写入 Redis；写操作会立即清理，TTL 仅作为兜底。
  cache:
    ttl: ${CACHE_TTL:24h}
  # 登录 / 注册 / 修改密码表单的 RSA 传输加密。
  # 私钥留空时首次启动自动生成到 {data-dir}/keys/form-rsa-private.pem。
  form-crypto:
    key-size: ${RSA_KEY_SIZE:2048}
    private-key: ${RSA_PRIVATE_KEY:}
    key-file: ${RSA_KEY_FILE:}
  rabbitmq:
    enabled: ${RABBITMQ_ENABLED:true}
  storage:
    type: ${STORAGE_TYPE:s3}
    endpoint: ${S3_ENDPOINT:http://127.0.0.1:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:resume-helper}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    path-style: ${S3_PATH_STYLE:true}
    public-read: ${S3_PUBLIC_READ:true}
    public-base-url: ${S3_PUBLIC_BASE_URL:http://127.0.0.1:9000/resume-helper}

mybatis-plus:
  # 每个模块的 resources/mapper 下都有对应的 Mapper XML。
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 默认把 SQL 与参数输出到控制台；生产环境可通过环境变量关闭。
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}
  global-config:
    banner: true
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  compression:
    enabled: true
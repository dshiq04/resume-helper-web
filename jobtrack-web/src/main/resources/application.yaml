# 通用配置：所有环境共享。
# 环境相关配置（端口、数据库、Redis、验证码、JWT、存储等）放在
# application-dev.yml / application-test.yml / application-prod.yml。
# 默认激活 dev，可通过 SPRING_PROFILES_ACTIVE 或 --spring.profiles.active 覆盖。
spring:
  application:
    name: jobtrack
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  sql:
    init:
      # 建表脚本均为 CREATE TABLE IF NOT EXISTS，可重复执行。
      mode: always
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  main:
    banner-mode: console

mybatis-plus:
  # 每个模块的 resources/mapper 下都有对应的 Mapper XML。
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: true
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  compression:
    enabled: true
  error:
    whitelabel:
      enabled: false

# 测试环境：独立测试库 + 独立 Redis 库，前端构建后可跨域直连本服务。
server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:18081}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:jobtrack_test}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
      connection-test-query: SELECT 1
  # 切换 PostgreSQL 时：替换上面的 datasource 为下面注释块，并改用 schema-postgresql.sql。
  # datasource:
  #   driver-class-name: org.postgresql.Driver
  #   url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:jobtrack_test}?sslmode=disable
  #   username: ${DB_USERNAME:postgres}
  #   password: ${DB_PASSWORD:}
  sql:
    init:
      schema-locations: classpath:schema-mysql.sql
      # schema-locations: classpath:schema-postgresql.sql
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:1}
      timeout: 2s
      connect-timeout: 2s

redis:
  enabled: true
  host: ${REDIS_HOST:127.0.0.1}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  database: ${REDIS_DATABASE:1}
  key-prefix: "jobtrack-test:"
  timeout: 2s

captcha:
  enabled: true
  type: char
  length: 4
  width: 130
  height: 44
  ttl-seconds: 180

app:
  name: 履途 ResumeTrail
  version: "1.2.1"
  data-dir: ./data
  log-dir: ./log
  seed-demo: false
  cors:
    allowed-origins:
      - http://127.0.0.1:5173
      - http://localhost:5173
      - http://127.0.0.1:4173
      - http://localhost:4173
  jwt:
    secret: ${JWT_SECRET:jobtrack-test-secret-change-me-0123456789abcdef}
    ttl-hours: 72
  storage:
    secret: ${STORAGE_SECRET:jobtrack-test-file-secret-change-me-0123456789}
    max-file-size-mb: 50
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:123456}
    display-name: 管理员
    tenant-name: 测试工作区

logging:
  level:
    root: INFO
  file:
    name: ./log/jobtrack-test.log

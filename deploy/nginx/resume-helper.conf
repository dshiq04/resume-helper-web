# =====================================================================
# 履途 ResumeTrail 前端 Nginx 配置
# 该文件由 CI 渲染后写入宿主机的 /etc/nginx/conf.d/ 下（宿主机直装 nginx）
#
# 注意：
#   1. nginx 监听 81 端口（配置文件内 listen 81），请确保宿主机防火墙放行 81。
#   2. __BACKEND_UPSTREAM__ 占位符会在 CI 部署时被替换为后端真实地址。
# =====================================================================

server {
    listen       81;
    server_name  _;

    # 前端静态文件（CI 会把 dist 产物以 resume-helper 命名复制进来）
    root  /usr/share/nginx/html/resume-helper;
    index index.html;

    # 单页应用路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 REST 接口反向代理（占位符由 CI 部署时替换）
    location /api/ {
        proxy_pass __BACKEND_UPSTREAM__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 简历文件上传（默认最大 50MB，与后端 MAX_FILE_SIZE_MB 保持一致）
        client_max_body_size 50m;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
    }

    # 静态资源缓存
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
